# Saki AI — PostgreSQL 16 + Spring Boot backend + Web IDE.
#   cp .env.example .env   # then fill in POSTGRES_PASSWORD, JWT_SECRET and GEMINI_API_KEY
#   docker compose up -d --build
# Web IDE:  http://localhost:${WEB_PORT:-8081}
# Backend:  http://localhost:${BACKEND_PORT:-8080}   (the Flutter app connects here over your LAN)

name: saki-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saki_ai}
      POSTGRES_USER: ${POSTGRES_USER:-saki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - saki-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./saki-backend
    image: saki-ai/backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saki_ai}
      DB_USERNAME: ${POSTGRES_USER:-saki}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash,gemini-flash-latest}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-1024}
      TTS_PROVIDERS: ${TTS_PROVIDERS:-gemini,azure,google}
      TTS_ASYNC_AUDIO: ${TTS_ASYNC_AUDIO:-true}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.8-flash-tts}
      GEMINI_TTS_SINHALA_VOICE: ${GEMINI_TTS_SINHALA_VOICE:-Charon}
      GEMINI_TTS_ENGLISH_VOICE: ${GEMINI_TTS_ENGLISH_VOICE:-Charon}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-southeastasia}
      AZURE_SINHALA_VOICE: ${AZURE_SINHALA_VOICE:-si-LK-SameeraNeural}
      AZURE_ENGLISH_VOICE: ${AZURE_ENGLISH_VOICE:-en-US-AvaNeural}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      GOOGLE_SINHALA_VOICE: ${GOOGLE_SINHALA_VOICE:-}
      GOOGLE_ENGLISH_VOICE: ${GOOGLE_ENGLISH_VOICE:-en-US-Neural2-F}
    ports:
      # Bound on all interfaces so the phone app can reach it over Wi-Fi.
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  web:
    build: ./saki-web
    image: saki-ai/web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  saki-postgres-data:
