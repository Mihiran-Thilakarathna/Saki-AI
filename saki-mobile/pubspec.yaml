name: saki_mobile
description: "Saki AI (සකි AI) - Bilingual Sinhala/English voice coding companion: standalone mobile mode and wireless Web IDE microphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  google_sign_in: 7.2.0
  just_audio: ^0.10.6
  record: ^6.2.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  stomp_dart_client: ^3.0.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
