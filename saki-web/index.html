<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="Saki AI – Your Bilingual (Sinhala & English) Voice Coding Companion" />
    <link rel="icon" type="image/svg+xml" href="/saki.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Saki AI</title>
    <script>
      // Apply the saved theme and chat colors before first paint (dark Classic by default).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('saki-theme') === 'light' ? 'light' : 'dark';
        var palette = localStorage.getItem('saki-palette');
        if (/^(ocean|forest|sunset|lavender)$/.test(palette || '')) document.documentElement.dataset.palette = palette;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
