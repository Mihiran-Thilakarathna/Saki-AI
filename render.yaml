# Render Blueprint for the Saki AI backend (free plan, no credit card).
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked
# "sync: false" are asked for when the Blueprint is created. See DEPLOY.md.
services:
  - type: web
    name: saki-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: saki-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # ---- Database (Neon free PostgreSQL) ----
      - key: DB_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"

      # ---- Security ----
      - key: JWT_SECRET
        generateValue: true # random 256-bit value, generated by Render
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://saki-ai.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false # optional: Google OAuth web client ID (leave empty to hide the button)

      # ---- Gemini (AI + voice) ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-flash-latest
      - key: TTS_PROVIDERS
        value: gemini,azure,google
      - key: TTS_ASYNC_AUDIO
        value: "true"

      # ---- Fit the free 512 MB instance ----
      - key: JAVA_OPTS
        value: >-
          -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
          -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
